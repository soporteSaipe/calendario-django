[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python manage.py migrate && gunicorn calendario_reservas.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production]
variables = { 
  DJANGO_SETTINGS_MODULE = "calendario_reservas.settings_simple",
  DEBUG = "False",
  SECRET_KEY = "your-secret-key-here-change-in-production"
}
