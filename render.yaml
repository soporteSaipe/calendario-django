services:
  - type: web
    name: calendario-reservas
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn calendario_reservas.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: "calendario_reservas.settings_production"
      - key: ALLOWED_HOSTS
        value: "calendario-reservas.onrender.com"

databases:
  - name: calendario-postgres
    plan: free
